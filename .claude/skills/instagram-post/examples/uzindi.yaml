    text: |-
      — Кім бар? — дедім дауысымды қатайтып.

      Жауап болмады. Тек дәліздегі шам бір сөніп, қайта жанды.

      Есікке жақындадым. Тоңазытқыштың гүрілі де тоқтап қалғандай еді. Құлыпқа қолымды созғанымда, арғы жақтан сыбыр естілді:

      — Ашпа. Ол сенің артыңда тұр.
