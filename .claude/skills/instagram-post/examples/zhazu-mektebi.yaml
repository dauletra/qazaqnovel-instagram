# Жазу мектебі — карусель: cover → step × 3–6 → cta.
rubric: zhazu-mektebi
slides:
  - layout: cover
    title: Оқырманды алғашқы абзацтан ұста
    subtitle: Жаңа бастаған авторға 3 тәсіл
  - layout: step
    number: "01"
    heading: Әрекеттен баста
    body: Ауа райы мен ұзақ сипаттаманы кейінге қалдыр. Бірінші сөйлемде бір нәрсе болып жатсын.
    example: Есік үшінші рет қағылды. Мен ешкімді күтпеген едім.
  - layout: step
    number: "02"
    heading: Сұрақ қалдыр
    body: Оқырман жауабын білгісі келетін бір сұрақ туғыз — кім? неге? енді не болады?
    example: Хаттың соңында қол қойылмаған еді. Бірақ мен бұл жазуды таныдым.
  - layout: step
    number: "03"
    heading: Кейіпкердің қалауын көрсет
    body: Кейіпкер не қалайды және оған не кедергі? Мұны бірінші беттен білдір.
    example: Айым бұл қаладан кетуге бел буды. Тек билет алуға ақшасы жетпейтін.
  - layout: cta
caption: |-
  Оқырман бірінші абзацты оқып, әрі қарай оқу-оқымауды шешеді. Үш тәсіл — бүгін-ақ қолданып көр.

  Қай тәсіл саған жақын? Пікірде жаз.

  Бірінші бөліміңді qazaqnovel.kz сайтында жарияла — тегін.
