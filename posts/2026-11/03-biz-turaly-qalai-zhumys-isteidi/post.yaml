slides:
  - layout: cover
    title: Шығармаң — сенікі
    subtitle: Qazaqnovel.kz қалай жұмыс істейді
  - layout: text
    heading: Жариялау тегін
    body: Жасына, мамандығына қарамастан кез келген адам жаза алады. Шығармаңды жариялау тегін.
  - layout: text
    heading: Модерация
    body: Бөлімдер жарияланар алдында модерациядан өтеді. Модератор сенім білдірген авторлардың бөлімдері бірден жарияланады, модерация оларды кейін қарап шығады.
  - layout: text
    heading: Шығарма — автордың меншігі
    body: |-
      Әр шығарма авторының меншігі және оның жеке ойы болып қала береді. Шығарманың жариялануы платформа редакциясының автор пікірімен келісетінін білдірмейді.

      Автор өз шығармасын кез келген уақытта платформадан өшіре алады.
  - layout: cta
    line: Бір бөлімнен баста — жалғасы өзі келеді.
caption: |-
  Qazaqnovel.kz-те шығармаңды жарияласаң, ол кімдікі болады? Жауабы қысқа: сенікі.

  Жариялау тегін. Бөлімдер модерациядан өтеді. Шығарма авторының меншігі болып қала береді, оны кез келген уақытта өшіре аласың.

  Сақтап қой, досыңа жібер — ол да жаза бастасын.

  Сілтеме профильде.
