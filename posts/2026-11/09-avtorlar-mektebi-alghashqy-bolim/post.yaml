# Закреплённый пост № 2: как опубликовать первую главу. Шаги и названия
# кнопок — по сайту (dauletra/qazaqnovel, 2026-10-10): вход только через
# Telegram, автосохранение раз в 5 секунд, ответ модерации до 24 часов.
rubric: avtorlar-mektebi
date: 2026-11-09
status: draft
pinned: 2
slides:
  - layout: cover
    title: Алғашқы бөлімді 5 қадамда жарияла
    subtitle: Жариялау тегін, авторлық құқық өзіңде
  - layout: step
    number: "01"
    heading: Telegram арқылы кір
    body: Сайтта тіркелу Telegram арқылы өтеді. Кірген соң атыңды таңда — оны бәрі көреді.
    example_label: Сайтта
    example: «Кіру» → Telegram → «Тіркелуді аяқтау»
  - layout: step
    number: "02"
    heading: Жаңа шығарма аш
    body: Төменгі мәзірдегі қаламды бас. Шығарманың атауын жаз да, жанрын таңда.
    example_label: Сайтта
    example: «Шығарма жазу» → «Жаңа шығарма» → «Жазуды бастау»
  - layout: step
    number: "03"
    heading: Алғашқы бөлімді жаз
    body: Мәтін әр 5 секунд сайын өзі сақталады — сақтау батырмасы керек емес. Абзацтарды бос жолмен бөл.
    example_label: Сайтта
    example: «Алғашқы бөлімді жазу»
  - layout: step
    number: "04"
    heading: Аннотация қос
    body: Оқырман каталогта шығарманы аннотация арқылы таңдайды. 2–3 сөйлем жеткілікті. Мұқабаны да осы жерде жүктейсің.
    example_label: Сайтта
    example: «Аннотация жазу» · «Мұқаба жүктеу»
  - layout: step
    number: "05"
    heading: Жариялауға жібер
    body: Бөлім модерациядан өтеді. Әдетте 24 сағат ішінде жауап береміз — шешім Telegram-ға келеді.
    example_label: Сайтта
    example: «Жариялауға жіберу»
  - layout: cta
caption: |-
  Алғашқы бөлімді жариялауға бес қадам ғана керек. Сақтап қой — жазуға отырғанда керек болады.

  Тіркелу — Telegram арқылы, мәтін өзі сақталады, жариялау тегін. Бөлім модерациядан өтеді, әдетте 24 сағат ішінде жауап береміз.

  Қай қадамда сұрақ туды? Пікірде жаз. Сілтеме профильде.
hashtags: ["#qazaqnovel", "#қазақшажаз", "#авторлармектебі"]
