slides:
  - layout: cover
    title: Әдебиет — тек классика емес
    subtitle: Әңгімелер, романдар, новеллалар — тегін
  - layout: text
    heading: Біздің мақсатымыз
    body: |-
      Qazaqnovel.kz — қазақ тілінде жазылған прозалық шығармалар жарияланатын әдеби платформа: әңгімелер, романдар, новеллалар.

      Әр адамға автор болуға, шығармашылығымен тегін бөлісуге, пікір алмасуға және басқа авторлардың туындыларымен танысуға мүмкіндік беру.
  - layout: text
    heading: Әдебиет — тек классика емес
    body: |-
      Қазақ әдебиеті дегенде ең алдымен мектепте оқыған классикалық шығармалар ойымызға келеді. Дегенмен әдебиет классикамен шектелмеуі керек деп есептейміз. Әр адамның басынан өткен оқиғасы да, қиялынан туған шығармасы да — қай жанрда жазылса да — жариялануға құқылы.
  - layout: text
    heading: Кім жазады
    body: |-
      Платформаны іске қосқанда біздің мақсатымыз — барлық адамға шығармасын жариялауға тең мүмкіндік беру еді. Сондықтан мұнда жасына, мамандығына қарамастан кез келген адам жаза алады. Алғашқы бөлім, алғашқы оқырман, алғашқы пікір — жаңа есімдер осылай туады.
  - layout: text
    heading: Қалай жұмыс істейді
    body: |-
      Бөлімдер жарияланар алдында модерациядан өтеді. Модератор сенім білдірген авторлардың бөлімдері бірден жарияланады, модерация оларды кейін қарап шығады. Жариялау тегін. Әр шығарма авторының меншігі және оның жеке ойы болып қала береді: шығарманың жариялануы платформа редакциясының автор пікірімен келісетінін білдірмейді. Автор өз шығармасын кез келген уақытта платформадан өшіре алады.
  - layout: cta
    line: Жазу үшін жазушы болу міндетті емес.
caption: |-
  Әдебиет — тек классика емес. Qazaqnovel.kz не үшін ашылды — осы постта.

  Мұнда жасына, мамандығына қарамастан кез келген адам қазақша жаза алады: әңгіме, роман, новелла. Жариялау тегін, шығарма — автордың меншігі.

  Сен де жазғың келе ме? Бір бөлімнен баста — жалғасы өзі келеді. Сілтеме профильде.
