slides:
  - layout: cover
    title: Әдебиет — тек классика емес
    subtitle: Qazaqnovel.kz туралы
  - layout: text
    heading: Біз кімбіз
    body: |-
      Qazaqnovel.kz — қазақ тілінде жазылған прозалық шығармалар жарияланатын әдеби платформа: әңгімелер, романдар, новеллалар.
  - layout: text
    heading: Біздің мақсатымыз
    body: Әр адамға автор болуға, шығармашылығымен тегін бөлісуге, пікір алмасуға және басқа авторлардың туындыларымен танысуға мүмкіндік беру.
  - layout: text
    heading: Әдебиет — тек классика емес
    body: Қазақ әдебиеті дегенде ең алдымен мектепте оқыған классикалық шығармалар ойымызға келеді. Дегенмен әдебиет классикамен шектелмеуі керек деп есептейміз. Әр адамның басынан өткен оқиғасы да, қиялынан туған шығармасы да — қай жанрда жазылса да — жариялануға құқылы.
  - layout: text
    heading: Кім жазады
    body: Мұнда жасына, мамандығына қарамастан кез келген адам жаза алады. Алғашқы бөлім, алғашқы оқырман, алғашқы пікір — жаңа есімдер осылай туады.
  - layout: cta
    line: Жазу үшін жазушы болу міндетті емес.
caption: |-
  Қазақ әдебиеті дегенде мектепте оқыған классика еске түседі. Біз әдебиет классикамен шектелмеуі керек деп есептейміз.

  Qazaqnovel.kz — қазақ тілінде жазылған әңгімелер, романдар, новеллалар жарияланатын әдеби платформа. Мұнда жасына, мамандығына қарамастан кез келген адам жаза алады, ал жариялау — тегін.

  Біз Instagram-дамыз: мұнда шығармалардан үзінділер, жазу тәсілдері, авторлармен сұхбаттар болады.

  Бір бөлімнен баста — сілтеме профильде.
