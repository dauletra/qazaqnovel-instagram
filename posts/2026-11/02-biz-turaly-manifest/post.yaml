slides:
  - layout: cover
    title: Әдебиет — тек классика ғана емес
    subtitle: Qazaqnovel.kz туралы
  - layout: text
    heading: Платформа туралы
    body: |-
      Qazaqnovel.kz — қазақ тілінде жазылған прозалық шығармаларды жариялайтын тегін әдеби платформа. Мұнда көбінесе веб-новелла форматындағы туындылар жарияланады.
  - layout: text
    heading: Біздің мақсатымыз
    body: Әр адамға автор болуға, шығармашылығымен тегін бөлісуге, пікір алмасуға және басқа авторлардың туындыларымен танысуға мүмкіндік беру.
  - layout: text
    heading: Әдебиет — тек классика ғана емес
    body: Қазақ әдебиеті дегенде ең алдымен мектепте оқыған классикалық шығармалар есімізге түседі. Дегенмен, әдебиет тек классикамен шектелмеуі керек деп есептейміз. Әр адамның басынан өткен оқиғасы да, қиялынан туған шығармасы да ортақ талқылауға, бөлісуге лайық.
  - layout: text
    heading: Кім жаза алады?
    body: Мұнда жасына, мамандығына қарамастан кез келген адам автор бола алады. Бірінші бөлім, алғашқы оқырман, алғашқы пікір — жаңа есімдер осылай туылады.
  - layout: cta
    line: Жазу үшін жазушы болудың қажеті жоқ.
caption: |-
  Қазақ әдебиеті дегенде мектепте оқыған классика есімізге түседі. Біз әдебиет тек классикамен шектелмеуі керек деп санаймыз.

  Qazaqnovel.kz — қазақ тілінде жазылған прозалық шығармаларды жариялайтын тегін әдеби платформа. Мұнда көбінесе веб-новелла форматындағы туындылар жарияланады. Жасына, мамандығына қарамастан кез келген адам жаза алады.

  Біз Instagram-дамыз: мұнда шығармалардан үзінділер, жазу тәсілдері, авторлармен сұхбаттар жарияланады.

  Бірінші бөлімнен баста — сілтеме профильде.
