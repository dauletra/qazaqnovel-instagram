# Оқиға өнері — сторителлинг, модуль 1, урок 3. План: plan/storytelling-course.md.
rubric: avtorlar-mektebi
date: 2026-12-21
status: draft
slides:
  - layout: cover
    title: Оқиғаңды бір сөйлемге сыйғыз
    subtitle: Оқиға өнері · 3-сабақ
  - layout: step
    number: "01"
    heading: Логлайн деген не
    body: Логлайн — оқиғаның бір сөйлемдік түйіні. Кино әлемінен келген сөз. Ол оқиғаңның негізі бар-жоғын тексереді.
  - layout: step
    number: "02"
    heading: Төрт бөлігі
    body: Кім? Не қалайды? Не кедергі? Жеңілсе не болады? Төртеуі бір сөйлемге сыйса — оқиғаңның өзегі дайын.
  - layout: step
    number: "03"
    heading: Мысал
    body: Кейіпкер, мақсат, кедергі және бәс — бәрі бір сөйлемде.
    example: Жетім қыз анасын іздеуге бел буады, бірақ оның өткенін білетіндердің бәрі үндемейді.
  - layout: step
    number: "04"
    heading: Жиі қате — мазмұндама
    body: Логлайн — қысқаша мазмұн емес. Соңын айтпа, барлық кейіпкерді атама. Басты кейіпкер, мақсат, кедергі — жетеді.
  - layout: step
    number: "05"
    heading: Оқиғаңның компасы
    body: Аннотация жазғанда, атау іздегенде, сюжеттен адасқанда логлайнға қайта орал.
  - layout: step
    number: "06"
    heading: Тапсырма
    body: Өз оқиғаңның логлайнын жаз — 25 сөзден аспасын. Қызықтыларын стористе бөлісеміз.
    example: Кейіпкер … қалайды, бірақ … Егер жеңілсе, …
    example_label: Тапсырма
  - layout: cta
    line: Бір бөлімнен баста.
caption: |-
  Оқиғаңды бір сөйлеммен айтып бере аласың ба? Айта алмасаң — оқиғаның өзегі әлі табылмаған шығар.

  Логлайн — оқиғаның бір сөйлемдік түйіні: кім, не қалайды, не кедергі, жеңілсе не болады. Кинодан келген тәсіл, бірақ проза авторына да таптырмайды.

  Идея: Блейк Снайдер, «Save the Cat!».

  Тапсырма: өз оқиғаңның логлайнын жаз — 25 сөзден аспасын. Пікірге қалдыр, қызықтыларын стористе бөлісеміз.

  «Оқиға өнері — сторителлинг» курсының 3-сабағы. Сақтап қой.
