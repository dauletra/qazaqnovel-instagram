# Сторителинг, сезон 1, урок 4. План: plan/storytelling-course.md.
# Примеры — сквозная история «Түнгі пошта» (Айым).
rubric: avtorlar-mektebi
date: 2026-12-28
status: draft
slides:
  - layout: cover
    title: Соңында кім өзгерді?
    subtitle: Сторителинг · 4-сабақ
  - layout: step
    number: "01"
    heading: Оқиға — өзгеріс туралы
    body: Не болғаны маңызды. Бірақ одан да маңыздысы — болған оқиға кейіпкерді қалай өзгертті.
  - layout: step
    number: "02"
    heading: Басы мен соңын салыстыр
    body: Кейіпкеріңді алғашқы және соңғы бөлімде қатар қой. Ол енді басқаша ойлай ма, басқаша әрекет ете ме?
    example: Басында Айым — «Бәрін өзім істеймін». Соңында — досынан көмек сұрайды.
  - layout: step
    number: "03"
    heading: Өзгеріс әрекетте көрінеді
    body: «Ол өзгерді» деп жазба. Басында жасамайтын нәрсені кейіпкер соңында жасасын — оқырман өзі түсінеді.
  - layout: step
    number: "04"
    heading: Жиі қате — бір сәтте өзгеру
    body: Кейіпкер бір күнде, себепсіз өзгеріп шыға келсе, оқырман сенбейді. Өзгеріс оқиға бойы біртіндеп жиналады.
  - layout: step
    number: "05"
    heading: Төрт сабақ — бір жазба
    body: Логлайн, қалау мен қажеттілік, кейіпкер басында қандай, соңында қандай — бәрін бір жазбаға жина.
    example: Бұл — оқиғаңның негізі. Қаңтарда жанр мен бірінші бөлімге көшеміз.
    example_label: Тапсырма
  - layout: cta
    line: Бір бөлімнен баста.
caption: |-
  Оқиғаның соңында кейіпкерің басындағыдай болып қалса, оқиға болды ма?

  Оқиға — болған жайттардың тізімі емес, сол жайттар кейіпкерді қалай өзгерткені. «Түнгі пошта» оқиғасының басында Айым бәрін жалғыз істейді, соңында көмек сұрауды үйренеді. Өзгерісті сөзбен айтпа, әрекетпен көрсет.

  Идея: Лиза Крон, «Wired for Story»; Роберт Макки, «Story».

  Тапсырма: логлайн, қалау мен қажеттілік, кейіпкердің басы мен соңы — бәрін бір жазбаға жина. Қаңтарда жанр, алғашқы нұсқа және бірінші бөлім — сол жазбаның үстінен жұмыс істейміз.

  «Сторителинг» курсының 4-сабағы. Сақтап қой.
