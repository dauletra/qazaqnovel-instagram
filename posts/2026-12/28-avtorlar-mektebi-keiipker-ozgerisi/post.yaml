# Оқиға өнері — сторителлинг, модуль 1, урок 4 (итог модуля). План: plan/storytelling-course.md.
rubric: avtorlar-mektebi
date: 2026-12-28
status: draft
slides:
  - layout: cover
    title: Соңында кім өзгерді?
    subtitle: Оқиға өнері · 4-сабақ
  - layout: step
    number: "01"
    heading: Оқиға — өзгеріс туралы
    body: Не болғаны маңызды. Бірақ одан да маңыздысы — болған оқиға кейіпкерді қалай өзгертті.
  - layout: step
    number: "02"
    heading: Басы мен соңын салыстыр
    body: Кейіпкеріңді алғашқы және соңғы бөлімде қатар қой. Ол енді басқаша ойлай ма, басқаша әрекет ете ме?
    example: Басында — «Маған ешкім керек емес». Соңында — досынан көмек сұрайды.
  - layout: step
    number: "03"
    heading: Өзгеріс әрекетте көрінеді
    body: «Ол өзгерді» деп жазба. Басында жасамайтын нәрсені кейіпкер соңында жасасын — оқырман өзі түсінеді.
  - layout: step
    number: "04"
    heading: Жиі қате — бір сәтте өзгеру
    body: Кейіпкер бір күнде, себепсіз өзгеріп шыға келсе, оқырман сенбейді. Өзгеріс оқиға бойы біртіндеп жиналады.
  - layout: step
    number: "05"
    heading: Модуль тапсырмасы
    body: Төрт сабақты бір жазбаға жина — логлайн, қалау мен қажеттілік, кейіпкер басында қандай, соңында қандай.
    example: Бұл — оқиғаңның негізі. Қаңтарда кейіпкерді тереңдетеміз.
    example_label: Тапсырма
  - layout: cta
    line: Бір бөлімнен баста.
caption: |-
  Оқиғаның соңында кейіпкерің басындағыдай болып қалса, оқиға болды ма?

  Оқиға — болған жайттардың тізімі емес, сол жайттар кейіпкерді қалай өзгерткені. Өзгерісті сөзбен айтпа, әрекетпен көрсет.

  Идея: Лиза Крон, «Wired for Story»; Роберт Макки, «Story».

  Бірінші модуль осымен аяқталды. Модуль тапсырмасы: логлайн, қалау мен қажеттілік, кейіпкердің басы мен соңы — бәрін бір жазбаға жина. Қаңтарда сол кейіпкермен жұмысты жалғастырамыз.

  «Оқиға өнері — сторителлинг» курсының 4-сабағы. Сақтап қой.
