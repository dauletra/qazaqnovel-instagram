# Сторителинг, сезон 1, урок 1. План: plan/storytelling-course.md.
# Примеры — сквозная история «Түнгі пошта» (Айым).
rubric: avtorlar-mektebi
date: 2026-12-07
status: draft
slides:
  - layout: cover
    title: Оқиғаның үш негізі
    subtitle: Сторителинг · 1-сабақ
  - layout: step
    number: "01"
    heading: Кейіпкер, қалау, кедергі
    body: Біреу бір нәрсені қатты қалайды, ал оған бір нәрсе кедергі жасайды. Үшеуінің бірі жоқ болса, оқиға да жоқ.
  - layout: step
    number: "02"
    heading: Кедергісіз оқиға жоқ
    body: "Кейіпкер қалағанына бірден жетсе, оқырманға күтетін ештеңе қалмайды. Қызығушылық «жете ме, жоқ па?» деген сұрақтан туады."
  - layout: step
    number: "03"
    heading: Әлсіз нұсқа
    body: Бұл — оқиғалар тізімі. Бәрі болып жатыр, бірақ ешкім ештеңе қаламайды.
    example: Айым түнде поштада жұмыс істеді. Хаттарды сұрыптады. Таңертең үйге қайтты.
    example_label: Былай емес
  - layout: step
    number: "04"
    heading: Күшті нұсқа
    body: "Енді қалау да, кедергі де бар. Оқырман бірден сұрайды: бұл қалай мүмкін?"
    example: Айым хатты кім жазғанын білгісі келеді. Жазу — өзінікі. Бірақ хат отыз жыл бұрын жіберілген.
    example_label: Былай
  - layout: step
    number: "05"
    heading: Жиі қате — әлсіз кедергі
    body: Кедергі оңай жеңілсе, оқырман алаңдамайды. Кейіпкерге шынымен қиын болсын — сонда жеңісі де құнды.
  - layout: step
    number: "06"
    heading: Тапсырма
    body: Өз оқиғаңды осы үлгімен бір сөйлемге жаз да, пікірге қалдыр.
    example: Кейіпкерім … қалайды, бірақ оған … кедергі.
    example_label: Тапсырма
  - layout: cta
    line: Бір бөлімнен баста.
caption: |-
  Неге кейбір оқиғаны бір демде оқып шығамыз, ал кейбірі екінші бетте-ақ жалықтырады?

  «Сторителинг» курсы басталды. Әр дүйсенбі — бір сабақ, бір тәсіл, бір тапсырма. Курс бойы бір оқиғаны бірге құрамыз: «Түнгі пошта» — түнгі ауысымда өз қолымен жазылған ескі хатты тауып алған Айым туралы.

  Бүгін — оқиғаның үш негізі: кейіпкер, қалау, кедергі.

  Идея: Лиза Крон, «Wired for Story»; Роберт Макки, «Story».

  Тапсырма: өз оқиғаңды бір сөйлемге жаз — «… қалайды, бірақ оған … кедергі». Жауабыңды пікірге қалдыр.

  Сақтап қой — келесі сабақта керек болады.
