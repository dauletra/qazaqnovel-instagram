# Сторителинг, модуль 1, урок 2. План: plan/storytelling-course.md.
rubric: avtorlar-mektebi
date: 2026-12-14
status: draft
slides:
  - layout: cover
    title: Кейіпкер не қалайды, оған не керек?
    subtitle: Сторителинг · 2-сабақ
  - layout: step
    number: "01"
    heading: Қалау — сыртқы мақсат
    body: "Кейіпкер не істегісі келеді: байқауда жеңу, үйге оралу, жұмбақты шешу. Мұны көзбен көруге болады."
    example: Дана қаладағы ең үздік аспаз болғысы келеді.
  - layout: step
    number: "02"
    heading: Қажеттілік — ішкі өзгеріс
    body: Кейіпкердің өзі де білмейтін нәрсе — оған шын мәнінде не жетіспейді. Оқиғаның соңында ол соны табады.
    example: Дана жеңілуден қорықпай, басқаларға сенуді үйренуі керек.
  - layout: step
    number: "03"
    heading: Екеуі қақтығысады
    body: Қалауы мен қажеттілігі қарама-қайшы келсе, оқиға қызық. Мақсатына жету үшін кейіпкер өзгеруге мәжбүр.
    example: Дана жалғыз жеңе алмайды — байқауда командамен жұмыс істеу керек.
  - layout: step
    number: "04"
    heading: Жиі қате — тек қалау
    body: Кейіпкер мақсатына жетеді, бірақ ішінде ештеңе өзгермейді. Оқиға аяқталды, бірақ есте қалмайды.
  - layout: step
    number: "05"
    heading: Тапсырма
    body: "Кейіпкерің туралы екі сөйлем жаз: не қалайды және оған шын мәнінде не керек."
    example: Ол … қалайды. Бірақ оған … керек.
    example_label: Тапсырма
  - layout: cta
    line: Бір бөлімнен баста.
caption: |-
  Кейіпкерің не қалайды? Ал оған шын мәнінде не керек? Бұл — екі түрлі сұрақ.

  Қалау — кейіпкер қуып жүрген сыртқы мақсат. Қажеттілік — оның өзі де байқамайтын ішкі кемшілігі. Екеуі қақтығысқанда оқиға тереңдейді.

  Идея: Джон Труби, «The Anatomy of Story».

  Тапсырма: кейіпкерің туралы екі сөйлем жаз — не қалайды, оған не керек. Пікірде бөліс.

  «Сторителинг» курсының 2-сабағы. Сақтап қой.
